<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Это мой умный сайт</h1>
    <h4>Он определит твоё настроение</h4>
    
    <form action="/submit" method="post">
        <label for="message">Как у вас дела?</label><br>
        <textarea name="message" id="message" rows="3" cols="50" 
        placeholder="Например, жизнь прекрасна"></textarea><br>
        <button>Отправить</button>
    </form>

    <p>Вас перенаправит на страницу с ответом</p>
</body>
</html>
